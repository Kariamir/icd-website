<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="تصویر نمونه: عکس آرشیوی کارگاه ساختمانی">
  <rect width="1600" height="1000" fill="#d6d6d2"/>
  <rect width="1600" height="620" fill="#c4c4bf"/>
  <!-- distant skyline -->
  <rect x="60" y="430" width="180" height="190" fill="#b2b2ac"/>
  <rect x="270" y="470" width="130" height="150" fill="#bcbcb6"/>
  <rect x="1310" y="450" width="220" height="170" fill="#b2b2ac"/>
  <!-- part-built concrete frame: columns and slabs -->
  <g fill="#8e8e88">
    <rect x="470" y="250" width="34" height="500"/>
    <rect x="640" y="250" width="34" height="500"/>
    <rect x="810" y="250" width="34" height="500"/>
    <rect x="980" y="250" width="34" height="500"/>
    <rect x="1150" y="250" width="34" height="500"/>
  </g>
  <g fill="#7b7b75">
    <rect x="450" y="250" width="754" height="26"/>
    <rect x="450" y="390" width="754" height="26"/>
    <rect x="450" y="530" width="754" height="26"/>
    <rect x="450" y="670" width="754" height="26"/>
  </g>
  <!-- rebar cage on the top slab -->
  <g stroke="#6b6b65" stroke-width="5">
    <path d="M470 250 V196 M540 250 V180 M610 250 V196 M680 250 V176 M750 250 V196 M820 250 V182 M890 250 V196 M960 250 V178 M1030 250 V196 M1100 250 V184 M1170 250 V196"/>
    <path d="M460 206 H1186 M460 232 H1186"/>
  </g>
  <!-- tower crane -->
  <g fill="#6b6b65">
    <rect x="236" y="150" width="30" height="610"/>
    <rect x="120" y="150" width="700" height="18"/>
    <rect x="120" y="168" width="18" height="52"/>
  </g>
  <g stroke="#6b6b65" stroke-width="6" fill="none">
    <path d="M251 96 L140 150 M251 96 L700 150"/>
    <path d="M560 168 V430"/>
  </g>
  <rect x="528" y="430" width="66" height="46" fill="#5f5f59"/>
  <!-- ground, spoil heap and two figures -->
  <rect y="750" width="1600" height="250" fill="#b9b9b3"/>
  <path d="M1180 750 L1330 666 L1500 750 Z" fill="#a4a49e"/>
  <g fill="#55554f">
    <path d="M352 750 v-66 a16 16 0 0 1 32 0 v66 z"/>
    <circle cx="368" cy="668" r="15"/>
    <path d="M418 750 v-60 a15 15 0 0 1 30 0 v60 z"/>
    <circle cx="433" cy="674" r="14"/>
  </g>
  <rect width="1600" height="1000" fill="none" stroke="#efefeb" stroke-width="40"/>
</svg>
